<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Car Racing Game</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#222;
    font-family:Arial;
}

canvas{
    display:block;
    margin:auto;
    background:#666;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-size:24px;
}

#speed{
    position:absolute;
    top:45px;
    left:10px;
    color:white;
    font-size:24px;
}

#startBtn{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:15px 30px;
    font-size:24px;
    cursor:pointer;
}
</style>

</head>
<body>

<div id="score">Score: 0</div>
<div id="speed">Speed: 0</div>

<button id="startBtn" onclick="startGame()">
Start Game
</button>

<canvas id="gameCanvas" width="400" height="700"></canvas>

<script>

const canvas =
document.getElementById("gameCanvas");

const ctx =
canvas.getContext("2d");

let score = 0;
let speed = 5;
let gameStarted = false;

const car = {
    x:170,
    y:560,
    width:60,
    height:100,
    moveSpeed:7
};

let obstacles = [];

function startGame(){
    gameStarted = true;

    document.getElementById("startBtn")
    .style.display = "none";
}

function createObstacle(){

    obstacles.push({
        x:Math.random()*330,
        y:-120,
        width:60,
        height:100
    });
}

setInterval(createObstacle,1200);

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key] = true;
});

document.addEventListener("keyup",e=>{
    keys[e.key] = false;
});

function drawRoad(){

    ctx.fillStyle="#555";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.strokeStyle="white";
    ctx.lineWidth=5;

    for(let i=0;i<700;i+=40){

        ctx.beginPath();

        ctx.moveTo(200,i);

        ctx.lineTo(200,i+20);

        ctx.stroke();
    }
}

function drawCar(){

    ctx.fillStyle="red";

    ctx.fillRect(
        car.x,
        car.y,
        car.width,
        car.height
    );
}

function drawObstacles(){

    ctx.fillStyle="blue";

    obstacles.forEach(o=>{

        ctx.fillRect(
            o.x,
            o.y,
            o.width,
            o.height
        );

        o.y += speed;

        if(o.y > 700){

            score++;

            document.getElementById("score")
            .innerText =
            "Score: " + score;
        }
    });

    obstacles =
    obstacles.filter(o=>o.y<800);
}

function collision(a,b){

    return (

        a.x < b.x+b.width &&

        a.x+a.width > b.x &&

        a.y < b.y+b.height &&

        a.y+a.height > b.y

    );
}

function update(){

    if(keys["ArrowLeft"] &&
       car.x > 0){

        car.x -= car.moveSpeed;
    }

    if(keys["ArrowRight"] &&
       car.x <
       canvas.width-car.width){

        car.x += car.moveSpeed;
    }

    if(keys["ArrowUp"]){

        speed += 0.1;

        if(speed > 15){
            speed = 15;
        }
    }

    if(keys["ArrowDown"]){

        speed -= 0.2;

        if(speed < 2){
            speed = 2;
        }
    }

    document.getElementById("speed")
    .innerText =
    "Speed: " + Math.floor(speed);

    for(let o of obstacles){

        if(collision(car,o)){

            alert(
            "Game Over!\nScore: "
            + score
            );

            location.reload();
        }
    }
}

function gameLoop(){

    if(!gameStarted){

        requestAnimationFrame(
        gameLoop
        );

        return;
    }

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawRoad();

    update();

    drawCar();

    drawObstacles();

    requestAnimationFrame(
    gameLoop
    );
}

gameLoop();

</script>

</body>
</html>
